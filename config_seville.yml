## Synthetic population pipeline for seville
## based on the synpp package

# This is the path to a directory where the pipeline can store temporary data
working_directory: cache

# This section defines which parts of the pipeline should be run
run:
  #- synthesis.population.spatial.locations
  - synthesis.population.spatial.locations

# Here the configuraiton of the pipeline starts
config:
  # Some general configuration
  processes: 8

  # Define whether to use ENTD or EGT as the household travel survey (HTS)
  hts: entd

  # Define sampling rate and random seed for the output population
  sampling_rate: 0.01
  acquisition_sample_size: 1
  random_seed: 1234
 
  # Paths to the input data and where the output should be stored
  data_path: ../raw_data/Seville
  output_path: output
  output_prefix: seville_1pct_
  seville.population_shp: shapefiles/census_district_shapefiles/SECC_CE_20220101.shp
  seville.buildings_path: /buildings/buildings_seville.shp
  osm_path_seville: osm/andalucia-latest.osm.pbf
  check_spatial_codes: True
  analysis_path: output/analysis
  osmconvert_binary: /{fill in}/sutLab/osmconvert" # absolute path to osmconvert_binary

  # Only interesting if you run the simulation
  java_memory: 6G

  # Defaults for seville
  home_location_sampling: weighted
  mode_choice: true
  matching_attributes: ["sex", "age_class", "has_license"]

  gtfs_path: gtfs
  osm_path: osm
  osmosis_binary: osmosis/bin


# Overrides for the seville pipeline compared to the Île-de-France pipeline
aliases:
  data.census.filtered: seville.ipf.attributed
  synthesis.population.income.selected: seville.income
  synthesis.population.matched: seville.matched
  synthesis.population.spatial.home.zones: seville.homes
  synthesis.locations.home.locations: seville.locations.home
  synthesis.locations.education: seville.locations.education
  synthesis.locations.secondary: seville.locations.secondary
  synthesis.locations.work: seville.locations.work
  data.od.weighted: seville.gravity.model
  data.spatial.iris: seville.data.spatial.iris
  data.spatial.codes: seville.entd_codes
  synthesis.population.spatial.primary.locations: seville.locations.synthesis.replacement
  #synthesis.population.enriched: seville.synthesis.population.enriched #taken from munich mid aggregate
  matsim.simulation.prepare: seville.matsim.simulation.prepare
  #analysis.statistics: analysis.seville.statistics
  data.hts.entd.raw: seville.data.hts.entd.raw
  data.hts.entd.filtered: seville.data.hts.entd.filtered
  data.hts.entd.cleaned: seville.data.hts.entd.cleaned
  data.hts.entd.reweighted: seville.data.hts.entd.reweighted
  matsim.simulation.prepare: matsim.scenario.prepare
  

