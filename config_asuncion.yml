## Synthetic population pipeline for asuncion
## based on the synpp package

# This is the path to a directory where the pipeline can store temporary data
working_directory: cache

# This section defines which parts of the pipeline should be run
run:
  - synthesis.output
#  - analysis.asuncion.ivt_style.compare_ipu

#  - analysis.asuncion.ivt_style.analysis_distance_distribution
#  - analysis.asuncion.asuncion_archive
#  - analysis.asuncion.asuncion_compare_models
config:


  # ======== Archive only configs =================
  # These are not relevant for normal stage runs
  gravity_run_name: "non_constrained_model"
  run_description: ""
  gravity_model_type: power_law # exponential or power_law
  config_file: config_asuncion.yml
  gravity_calibration_stage: asuncion.gravity.calibrate
  gravity_od_stage: asuncion.gravity.model
  # need to also change stage mapping in the bottom part of the config
  # ===============================================

  # Some general configuration
  processes: 8

  # Define whether to use ENTD or EGT as the household travel survey (HTS)
  hts: entd

  # Define sampling rate and random seed for the output population
  sampling_rate: 0.01
  acquisition_sample_size: 1
  random_seed: 1234

  # Paths to the input data and where the output should be stored
  data_path: ../raw_data/Asuncion
  output_path: output
  output_prefix: asuncion_1pct_
  asuncon.population_shp: shapefiles/census_district_shapefiles/SECC_CE_20220101.shp
  asuncion.buildings_path: catastre_buildings/all_buildings.gpkg
  osm_path_asuncion: osm/paraguay-260810.osm.pbf
  check_spatial_codes: True
  analysis_path: output/analysis
  osmconvert_binary: "/cluster/scratch/snekula/sutlab/sutLab/osmconvert"
  #osmconvert_binary: "/home/xnekul/windir/ETH_SUTlab/sutLab/osmconvert"

  simulation_output_dir: output/simulation
  # Only interesting if you run the simulation
  java_memory: 6G

  # Defaults for asuncion
  

  pipeline_crs: "EPSG:32721"
  home_location_sampling: weighted
  mode_choice: False
  matching_attributes: ["sex", "age_class", "has_license"]
  IPU_aggregation_level: "commune_id"
  commune_equivalent: "district" # or borough, borough not working right now

  education_graduation_age: 
    school: 17
     # university all above last entry
  education_assignment_method: "distance"
  work_assignment_method: "gravity"


  osm_path: osm
  osmosis_binary: osmosis/bin
  gtfs_path: gtfs/Line1

  eqasim_commit: f375a37
  eqasim_version: "2.0.0"
  eqasim_branch: "sutlab" 


aliases:
  data.hts.entd.raw: asuncion.data.hts.entd.raw
  data.hts.entd.filtered: asuncion.data.hts.entd.filtered
  data.hts.entd.cleaned: asuncion.data.hts.entd.cleaned
  data.hts.entd.reweighted: asuncion.data.hts.entd.reweighted

  synthesis.population.sampled: asuncion.ipu.attributed
  data.census.filtered: asuncion.ipu.attributed
  data.spatial.iris: asuncion.data.spatial.iris
  data.spatial.codes: asuncion.entd_codes

  synthesis.population.enriched: asuncion.synthesis.population.enriched

  synthesis.population.income.selected: asuncion.income
  synthesis.population.spatial.home.zones: asuncion.homes

  synthesis.locations.home.locations: asuncion.locations.home
  synthesis.locations.secondary: asuncion.locations.secondary
  synthesis.locations.work: asuncion.locations.work
  synthesis.locations.education: asuncion.data.education
  
  # Use one of the 3 models
  data.od.weighted: asuncion.gravity.model
#  data.od.weighted: asuncion.gravity.model_production_constrained
#  data.od.weighted: asuncion.gravity.model_doubly_constrained
  
  synthesis.population.matched: asuncion.synthesis.population.matched

  synthesis.population.spatial.primary.locations: asuncion.primary_locations_assignment 
  synthesis.population.spatial.primary.candidates: asuncion.gravity.work_candidates


  synthesis.population.trips: asuncion.synthesis.population.trips
  synthesis.population.spatial.locations: asuncion.synthesis.population.spatial.locations
  synthesis.population.spatial.secondary.locations: asuncion.synthesis.population.spatial.secondary.locations
  synthesis.population.spatial.primary.distance_distributions: seville.synthesis.population.spatial.primary.distance_distributions

  matsim.simulation.prepare: seville.matsim.simulation.prepare
  matsim.simulation.run: seville.matsim.simulation.run
  matsim.scenario.prepare: seville.matsim.scenario.prepare # matsim.scenario.prepare stage is not used in simulation at all
  matsim.scenario.population: seville.matsim.scenario.population

  synthesis.output: asuncion.output

  
  data.gtfs.cleaned: seville.data.gtfs.cleaned


  synthesis.population.spatial.home.locations: asuncion.synthesis.population.spatial.home.locations